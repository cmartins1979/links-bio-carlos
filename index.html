    <!-- Script de repasse de UTMs (Triwer) -->
    <script>
      (function() {
        function appendUtmsToUrl(urlStr) {
          if (!window.location.search) return urlStr;
          try {
            const url = new URL(urlStr, window.location.origin);
            const currentParams = new URLSearchParams(window.location.search);
            currentParams.forEach((value, key) => {
              url.searchParams.set(key, value);
            });
            return url.toString();
          } catch (e) {
            return urlStr;
          }
        }

        function isTrackableLink(href) {
          return href && href.startsWith("http") && !href.startsWith(window.location.origin);
        }

        function updateLinks() {
          if (!window.location.search) return;
          var links = document.querySelectorAll('a');
          links.forEach(function(item) {
            if (isTrackableLink(item.href)) {
              item.href = appendUtmsToUrl(item.href);
            }
          });
        }

        window.addEventListener('DOMContentLoaded', updateLinks);
        window.addEventListener('load', updateLinks);

        document.addEventListener('click', function(e) {
          var link = e.target.closest('a');
          if (link && isTrackableLink(link.href)) {
            link.href = appendUtmsToUrl(link.href);
          }
        }, true);

        if (window.MutationObserver) {
          var observer = new MutationObserver(function() {
            updateLinks();
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }

        console.log('%cScript de rastreamento desenvolvido pela Triwer 🚀', 'font-size:16px;color:gold;');
      })();
    </script>
